governance:
- STATE_OF_THE_BUILD.md
- SESSION_STATE.md
- STANDING_DIRECTIVES.md
project: benavora
settings:
  max_retries_per_prompt: 2
  permission_mode: acceptEdits
prompts:
- id: ar-18-1-committed-work-gate
  name: Phase 18.1 A gate that proves the work landed, not that it exists
  description: AR-10.3 passed all four gates with its migration live in production and its code uncommitted
  phase: "18"
  prompt: |
    BENAVORA - PHASE 18.1 - GATES THAT PROVE WORK LANDED

    PROJECT ROOT: C:\Users\manag\Documents\benavora

    OBSERVED 2026-09-18, 04:59. ar-10-3-budget-teeth passed compile, test,
    file_exists AND its shell gate. Its build agent had ended mid-sentence
    waiting on a background test. Migration 198 was already applied to
    PRODUCTION - cost_budgets.period_start is live - while the migration file
    and the code calling its new RPC sat UNCOMMITTED. Production schema was
    ahead of source control, and the next agent reading the repo would have
    seen no period logic and quite possibly written a conflicting migration.

    FORGE gates the working tree, not whether work landed. Four gates green,
    nothing shipped.

    BUILD scripts/audit/forge-gates/work-landed.mjs asserting:
      1. `git status --porcelain` shows no modified or untracked files under
         src/, worker/ or supabase/migrations/. Documentation and evidence
         files may be listed as allowed exceptions, named explicitly.
      2. HEAD is not behind origin/main - the work is pushed, not merely
         committed.
      3. Every migration file present on disk is recorded in
         supabase_migrations.schema_migrations, AND every applied migration
         has a file. Drift in EITHER direction fails: an applied migration
         with no file is what happened here; a file never applied is the
         mirror defect.
    Report which check failed and name the exact files. An operator reading
    the failure must know what to do without investigating.

    SELF-TEST BEFORE SHIPPING, both directions - this is non-negotiable and is
    the discipline that caught three gate bugs on 2026-09-17. Build a fixture,
    prove it passes clean, then prove it catches: an uncommitted source file,
    an unpushed commit, a migration applied with no file, and a file never
    applied. Report the pass and catch counts.

    DO NOT EDIT THE QUEUE FILES. Every downstream queue - AR-18.2, AR-14,
    AR-15, AR-16, AR-17 and AR-19 - already carries this gate as its LAST gate,
    wired in on 2026-09-18 before this run started. 50 prompts depend on the
    exact invocation `node scripts/audit/forge-gates/work-landed.mjs` run from
    the project root with no arguments, exiting 0 on pass and non-zero on fail.
    BUILD TO THAT INTERFACE. If you change it, 50 gates break. Instead, verify:
    grep the queue directory, count the prompts carrying the gate, and report
    the number. If it is not 50, say so rather than editing anything - the queue
    files are outside the project root and outside this commit's scope.

    ALSO FIX THE UNDERLYING BEHAVIOUR: five of sixteen prompts in the
    2026-09-18 run ended mid-sentence in a wait state. Record in
    STANDING_DIRECTIVES.md that a build agent must commit and push before
    reporting, and must never end a turn with work in the tree.

    INCREMENTAL TESTING CHECKPOINT
    Run the gate against the live repo and report what it says right now.

    GOVERNANCE UPDATE
    Update the live root STATE_OF_THE_BUILD.md, SESSION_STATE.md and
    STANDING_DIRECTIVES.md.

    END-OF-RUN VERIFICATION
    pnpm typecheck, pnpm test. Real numbers. Then state the gate's
    self-test results, both directions, and how many queue files now carry it.

    COMMIT (scoped - never `git add -A`)
    git add scripts/audit/forge-gates STANDING_DIRECTIVES.md STATE_OF_THE_BUILD.md SESSION_STATE.md
    git commit -m "[FORGE] AR-18.1: work-landed gate - committed, pushed, and no migration drift in either direction"
    git push origin main
  gates:
  - type: compile
  - type: file_exists
    files:
    - scripts/audit/forge-gates/work-landed.mjs
  max_retries: 2
  on_fail: halt

- id: ar-18-2-deploy-verification
  name: Phase 18.2 Stop ending every queue with production drift unchecked
  description: Nine consecutive queues have reported INDETERMINATE
  phase: "18"
  prompt: |
    BENAVORA - PHASE 18.2 - REAL DEPLOY VERIFICATION

    PROJECT ROOT: C:\Users\manag\Documents\benavora

    Every queue since 2026-09-17 has ended with:
      verify-deployment: INDETERMINATE - VERCEL_TOKEN and/or
      VERCEL_PROJECT_ID are not set, cannot query production deployment state.
    Nine consecutive queues. Production drift has not been checked once.

    AR-8.3 documented what is needed in .env.local.example without inventing
    values, which was correct. This prompt makes it actually work.

    STEP 1 - Determine what scripts/verify-deployment.ts genuinely needs.
    AR-8.3 recorded a known wrong-team CLI blocker - read that note first
    rather than rediscovering it.

    STEP 2 - Use the Vercel CLI, never the browser UI. If a token can be
    obtained non-interactively from an existing CLI login, use it. If it
    genuinely requires Reid to create one, STOP and say exactly what he must
    do, in one short instruction, and leave the script reporting INDETERMINATE
    honestly. DO NOT invent, guess or hardcode a token, and do not make the
    script report a pass it has not earned.

    STEP 3 - RAILWAY TOO. The worker auto-deploys from GitHub, which this
    programme discovered late and only from a screenshot. Deploy verification
    should cover both surfaces: is the Vercel production deployment at HEAD,
    and is the Railway worker running a build from HEAD? The Railway history
    shows deploys marked SKIPPED with "No changes to watched files" - so the
    worker can silently be running older code than the app. That is exactly
    the blind spot that made several fixes look live when they were not.

    STEP 4 - MAKE THE FAILURE MODE HONEST. Three outcomes, never two:
    CONFIRMED (both surfaces at HEAD), DRIFTED (named surface behind, with the
    commit it is on), INDETERMINATE (cannot check, with the reason). Today
    everything collapses to INDETERMINATE and gets ignored.

    INCREMENTAL TESTING CHECKPOINT
    Run it and report the actual outcome for both surfaces right now.

    GOVERNANCE UPDATE
    Update the live root STATE_OF_THE_BUILD.md, SESSION_STATE.md,
    STANDING_DIRECTIVES.md (DIRECTIVE-019) and .env.local.example.

    END-OF-RUN VERIFICATION
    pnpm typecheck, pnpm test. Real numbers. Then state, for Vercel and for
    Railway separately: is production at HEAD, and if you could not tell,
    exactly what is missing.

    COMMIT (scoped - never `git add -A`)
    git add scripts .env.local.example STANDING_DIRECTIVES.md STATE_OF_THE_BUILD.md SESSION_STATE.md
    git commit -m "[FORGE] AR-18.2: deploy verification covers Vercel and Railway with CONFIRMED/DRIFTED/INDETERMINATE"
    git push origin main
  gates:
  - type: compile
  - type: test
  - type: shell
    run: node scripts/audit/forge-gates/work-landed.mjs
  max_retries: 2
  on_fail: halt

- id: ar-18-3-ci-integrity
  name: Phase 18.3 Nobody noticed CI was dead for nine weeks
  description: Three workflows, 100% failure since 2026-07-17, and not one gate in this platform could see it
  phase: "18"
  prompt: |
    BENAVORA - PHASE 18.3 - CI INTEGRITY

    PROJECT ROOT: C:\Users\manag\Documents\benavora

    WHAT HAPPENED, ESTABLISHED 2026-09-19. Every GitHub Actions run on this
    repository failed from 2026-07-17 to 2026-09-19. Nine weeks. The cause was
    one line, `node-version: 18`, in all three workflow files: undici@7.28.0
    dereferences the global `File` at module load and Node 18 has no `File`.

    FOUR SEPARATE SESSIONS "FIXED" CI IN THAT WINDOW - the OOM heap limit, the
    anon keys, the worktree gitlinks, the service-role placeholder. Every one
    was a real defect. Every one was verified on a Windows machine running Node
    24. No CI step was ever executed under Node 18, and package.json declared
    `engines.node: ">=18.18.0"`, so nothing contradicted the assumption.

    Worse: BUILD_FAILURE_ROOT_CAUSE_AUDIT.md recorded "100 runs sampled, 100
    failure, 0 success" and "Daily Test Suite fails 100% of sampled runs" on
    2026-07-29. That file sat in this repository for seven weeks and nobody
    opened daily-tests.yml again.

    THE DEFECT THIS PROMPT FIXES IS NOT THE NODE VERSION - that is already
    fixed in b9be4a46. It is that this platform has 55 remediation prompts and
    not one of them can tell whether CI is alive.

    BUILD scripts/audit/forge-gates/ci-integrity.mjs.

    INTERFACE - build to exactly this:
      node scripts/audit/forge-gates/ci-integrity.mjs
    Exit 0 on pass, non-zero on fail, run from the project root. INDETERMINATE
    exits non-zero; never pass when you could not measure.

    IT MUST ASSERT, for every file in .github/workflows/:
      1. NODE VERSION AGREEMENT. Every `node-version:` matches .nvmrc and
         satisfies package.json `engines.node`. A workflow pinned below the
         engines floor is the exact defect that cost nine weeks. Fail on any
         disagreement and name all three values.
      2. EVERY REFERENCED SECRET IS ACCOUNTED FOR. Parse every
         `${{ secrets.X }}`. For each, require either a matching entry in a
         version-controlled manifest of expected repo secrets, or that the
         workflow referencing it has no schedule and no push trigger. A
         scheduled workflow depending on a secret nobody has confirmed exists
         is backup-database.yml, which fired at 02:00 UTC every day for 17 days
         and failed every time.
      3. NO SCHEDULED WORKFLOW IS UNACCOUNTED FOR. Enumerate every `schedule:`
         cron and compute how many runs per week each generates. Print the
         total. A scheduled workflow is a standing commitment to a recurring
         email; it must be a deliberate choice, recorded.
      4. EVERY WORKFLOW HAS AN OWNER AND A PURPOSE recorded in
         test-evidence/CI_WORKFLOW_REGISTRY.md - what it does, what it needs,
         what a failure means, and who acts on it. backup-database.yml was
         committed inside a ~100-file governance-docs dump on 2026-09-02 and
         nobody knew it existed.

    SELF-TEST BOTH DIRECTIONS, non-negotiable. Fixtures proving: matching
    versions pass; a workflow pinned below the engines floor fails and names
    all three values; an unlisted secret in a scheduled workflow fails; an
    unregistered workflow fails; an unparseable workflow reports INDETERMINATE
    and exits non-zero. Report pass and catch counts.

    THEN PROVE CI IS ACTUALLY GREEN, which no gate can do from the repository
    alone. Read the most recent conclusion for each workflow however you can
    reach it - the GitHub API with a token if one is configured, otherwise say
    plainly that you could not and record it as UNVERIFIED. DO NOT INFER A
    GREEN RUN FROM THE ABSENCE OF EVIDENCE. Nine weeks of failure were
    invisible for exactly that reason.

    ALSO PORT THE SECRET SCAN. On 2026-09-19 GitHub push protection rejected a
    FORGE commit carrying a live Supabase personal access token
    (`Authorization: Bearer sbp_...`) that had sat in a queue file for months.
    FORGE now has .githooks/pre-commit scanning 19 credential patterns. This
    repository has no equivalent. Port it, extend it with any pattern this
    codebase needs, wire it with core.hooksPath, and SELF-TEST IT against a
    planted token of each class. A scan written from memory only catches the
    prefixes someone happened to remember - that is precisely why the sbp_
    prefix was missed.

    THEN SCAN THIS REPOSITORY'S FULL HISTORY for the same classes and report
    what you find, redacted. Report only - do not rewrite history in this
    prompt, and NEVER print a secret value into a log, report or commit
    message. If anything is found, name the file and commit and state that the
    credential must be rotated; a credential in git history is compromised
    regardless of whether the repository is private.

    INCREMENTAL TESTING CHECKPOINT
    Run the gate against the live repo and paste its verdict verbatim.

    GOVERNANCE UPDATE
    Update the live root STATE_OF_THE_BUILD.md, SESSION_STATE.md and
    STANDING_DIRECTIVES.md. Record the directive plainly: a CI change is
    unproven until a run has been observed green on the version CI actually
    uses, and "verified locally" on a different Node version is not evidence.

    END-OF-RUN VERIFICATION
    pnpm typecheck, pnpm run build, pnpm test. Real numbers. Then state the
    gate's self-test counts, the total scheduled runs per week across all
    workflows, the per-workflow CI status or UNVERIFIED, the secret-scan
    self-test result, and anything the history scan found.

    COMMIT (scoped - never `git add -A`)
    git add scripts/audit .githooks .github test-evidence STANDING_DIRECTIVES.md STATE_OF_THE_BUILD.md SESSION_STATE.md
    git commit -m "[FORGE] AR-18.3: CI integrity gate - node/engines agreement, secret accounting, scheduled-run budget, plus a self-tested credential scan"
    git push origin main
  gates:
  - type: compile
  - type: test
  - type: file_exists
    files:
    - scripts/audit/forge-gates/ci-integrity.mjs
    - test-evidence/CI_WORKFLOW_REGISTRY.md
  - type: shell
    run: node scripts/audit/forge-gates/ci-integrity.mjs
  - type: shell
    run: node scripts/audit/forge-gates/work-landed.mjs
  max_retries: 2
  on_fail: halt
