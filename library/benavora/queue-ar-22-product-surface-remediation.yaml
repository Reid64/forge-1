- id: ar-22-8-responsive-sweep
  name: Phase 22.8 Close the responsive gap and drive the baselines to zero
  description: 271 of 401 files had no breakpoint - this prompt owns whatever the batches did not reach
  phase: "22"
  prompt: |
    BENAVORA - PHASE 22.8 - RESPONSIVE SWEEP AND BASELINE CLOSEOUT

    PROJECT ROOT: C:\Users\manag\Documents\benavora

    AR-20.3 measured 130 of 401 files using any responsive breakpoint, meaning
    271 did not. AR-22.3 through AR-22.7 each handled responsiveness for their
    own batch. This prompt owns the remainder and the closeout.

    TWO JOBS.

    JOB 1 - THE REMAINDER. Read the current design-token and ui-primitives
    baselines. Whatever violations remain, and whatever routes still break
    below 768px, are here. Work them down. Take real screenshots at 375px,
    768px and 1440px for every remaining route and LOOK AT THEM - a breakpoint
    count is not evidence that a layout works, and this is the prompt where
    that distinction decides whether the sweep was real.

    DATA TABLES ARE THE HARD CASE and this product is full of them. A dense
    grant table cannot simply reflow. Decide the pattern once and apply it
    consistently: horizontal scroll within a contained region with the key
    column pinned, or a card layout below a stated breakpoint. State the
    decision, apply it everywhere, and record it as a contract so the next
    table built follows it rather than inventing a third pattern.

    JOB 2 - THE HONEST CLOSEOUT. State the final baseline numbers and the
    remainder plainly:
      - token violations: start 198 files, now how many
      - raw interactive elements: start 169 button, 86 input, 38 select, now
        how many
      - routes with no breakpoint: start 271 files, now how many
      - routes still EMPTY SHELL or CRASHING in route-baseline.json
      - serious and critical axe violations remaining, by route
    IF A BASELINE IS NOT ZERO, SAY SO AND SAY WHY. A remainder honestly stated
    is a usable input to the next programme. A baseline quietly raised to make
    a gate pass is the defect this entire remediation exists to remove, and it
    is the one thing you must not do in this prompt.

    DO NOT RAISE ANY BASELINE. If a gate fails, fix the code. If a violation is
    genuinely legitimate - a third-party embed, an illustration asset - add it
    to an explicit, named, individually justified allowlist in the baseline
    file, never a blanket exclusion and never a directory-wide one.

    INCREMENTAL TESTING CHECKPOINT
    Full visual regression across every route at 375px and 1440px, light and
    dark, plus an assertion that no route produces horizontal page scroll at
    375px.

