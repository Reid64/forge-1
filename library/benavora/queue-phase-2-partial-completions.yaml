      PARTIAL COMPLETION: Corporate Giving DNA agent exists. corporate_giving_dna table exists. Zero records populated. No data ingestion ever run.
      
      FIX SCOPE:
      1. Read src/lib/agents/corporate-giving-dna-agent.ts in full.
      2. Check corporate_giving_dna table schema: grep -A 30 "CREATE TABLE corporate_giving_dna" src/supabase/migrations/*.sql
      3. Find data source: SEC EDGAR corporate giving, Foundation Center corporate giver profiles, GiveWell corporate donors, corporate foundation 990s.
      4. Create ingestion script: src/scripts/ingest-corporate-giving-dna.ts
      5. Script should: scrape/ingest corporate giving patterns, giving size ranges, program focus areas, geographic focus, application requirements.
      6. Populate corporate_giving_dna table with 100+ corporate giver profiles (Fortune 500 foundations + major corp giving programs).
      7. Test: Run pnpm tsx src/scripts/ingest-corporate-giving-dna.ts. Verify 100+ rows in corporate_giving_dna.
      8. Create route POST /api/agents/corporate-giving-dna accepting { organization_id } and matching org to relevant corporate givers.
      9. Commit: git add -A; git commit -m "feat(intelligence): populate corporate giving DNA table and create matching agent"
      
      VERIFICATION:
      - corporate_giving_dna table has 100+ records
      - Agent returns relevant corporate givers for test org
      - Route /api/agents/corporate-giving-dna functional
      - Data includes giving size, focus areas, requirements
      
    gates:
      - type: compile
    max_retries: 3
    on_fail: stop
    depends_on: []

  - id: p2-004-flightpath-hud-rendering
    phase: completion
    description: "Complete FlightPath HUD rendering with stage colors and progress indicators"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: FlightPath HUD component exists but rendering incomplete. Stage colors not applied. Progress indicators missing.
      
      FIX SCOPE:
      1. Read src/components/FlightPathHUD.tsx in full.
      2. From STANDING_DIRECTIVES.md, stage colors are: Onboard=#0077B6, Research=#0096C7, Opportunities=#6B48CC, Grant Narratives=#10B981, AutoApply=#F59E0B, Donor Discovery=#EF4444
      3. Rewrite component with inline style={{ backgroundColor: '#0077B6' }} (never CSS variables, never Tailwind tokens).
      4. Each stage card must show: stage name, color badge, count of items in stage, progress bar (items completed / total), estimated days remaining.
      5. Visual polish: cards with shadows, rounded corners, hover states, click to expand details.
      6. Test in browser: verify all 6 stages render with correct colors, counts, progress bars.
      7. Commit: git add -A; git commit -m "fix(ui): complete FlightPath HUD rendering with stage colors and progress"
      
      VERIFICATION:
      - All 6 stage cards render with correct hex colors
      - Progress bars show completion % per stage
      - Item counts accurate (from database queries)
      - Hover states functional
      - Visual verified in browser
      
    gates:
