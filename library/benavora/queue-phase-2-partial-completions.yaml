      1. Read src/app/search/profiles/page.tsx in full.
      2. Read src/components/SearchResults.tsx.
      3. Add search input field: text input for funder name/category, filters for category/region.
      4. On search: call GET /api/search/funders?q={query}&category={category}&region={region}
      5. Render results as table: columns = Name, Category, Annual Budget, Relationship Score, Last Contacted, Actions (View Profile, Add to Opportunity).
      6. Pagination: show 20 results per page.
