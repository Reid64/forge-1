  - id: p2-008-admin-autoapply-job-list
    phase: completion
    description: "Add admin view for AutoApply job history and queue status"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: AutoApply queue populator exists. Admin has no visibility into job history, queue status, or failure reasons.
      
      FIX SCOPE:
      1. Create route GET /api/admin/autoapply/jobs returning paginated list of autoapply submission queue jobs.
      2. Each job includes: id, prospect_name, opportunity_name, status (pending/submitted/failed), created_at, submitted_at, error_message, retry_count.
      3. Create route GET /api/admin/autoapply/stats returning: total_pending, total_submitted, total_failed, avg_retry_count, oldest_pending_job_age.
      4. Create page src/app/admin/autoapply/page.tsx displaying:
