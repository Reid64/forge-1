  - id: p2-009-nightly-schedule-rebuild
    phase: completion
    description: "Create nightly schedule rebuild job (currently never runs)"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: Schedule-based opportunities (monthly/quarterly deadlines) exist. No job rebuilds schedules nightly. Deadlines can become stale.
      
      FIX SCOPE:
      1. Create new worker job src/worker/jobs/rebuild-schedules.ts
      2. Job should: query all opportunities with deadline_type = 'application_deadline', recalculate deadline_days_remaining, update opportunity.next_action_date.
      3. Mark opportunities as 'expired' if deadline_days_remaining <= 0.
      4. Create audit log entry in schedule_audit table: { opportunity_id, old_deadline, new_deadline, expired_status_change, executed_at }.
      5. Register in Railway worker: schedule to run daily at 2 AM UTC (9 PM CST previous day).
      6. Test: manually trigger job, verify opportunities updated.
      7. Commit: git add -A; git commit -m "feat(worker): add nightly schedule rebuild job to keep deadlines current"
      
      VERIFICATION:
      - Job reads all opportunities with deadlines
      - Recalculates deadline_days_remaining
      - Marks expired opportunities
      - Audit log populated
      - Scheduled in Railway
      - Manual test successful
      
    gates:
      - type: compile
    max_retries: 3
    on_fail: stop
    depends_on: []

  - id: p2-verify-all-completions
    phase: verify
    description: "Verify all 9 partial systems completed and integrated"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      VERIFICATION CHECKLIST:
      1. Board Packet Agent: POST /api/agents/board-packet generates full board packet from dossier
      2. Email Intelligence: Gmail webhook fires, EmailIntelligenceAgent executes, email_intelligence table populated
      3. Corporate Giving DNA: 100+ corporate giver profiles in table, matching agent functional
      4. FlightPath HUD: All 6 stages render with correct colors, progress bars show completion
      5. Donation Marketplace: Matching algorithm scores and ranks opportunities (0-100)
      6. Search Profiles: Search page functional, results render in table, pagination works
      7. KB Tabs: All category tabs labeled correctly, empty states display
      8. Admin AutoApply: Job list and stats visible, filters functional
      9. Nightly Schedules: Job scheduled in Railway, manual test updates opportunities
      10. Full test suite: pnpm test:unit passes, no regressions
      11. Deployment: npx vercel deploy --prod succeeds
      
      Update STATE_OF_THE_BUILD.md:
      - Section: PHASE 2 COMPLETIONS
      - List all 9 systems with "✅ VERIFIED" status
      - Record gate results: 9/9 prompts passed
      - Update "NEXT SESSION PRIORITIES" with Phase 3 scope
      
      Commit: git add -A; git commit -m "docs: Phase 2 partial completions verified, all 9 systems functional"
      
    gates:
      - type: compile
      - type: file_exists
        files: [STATE_OF_THE_BUILD.md]
    max_retries: 2
    on_fail: continue
    depends_on:
      - p2-009-nightly-schedule-rebuild
