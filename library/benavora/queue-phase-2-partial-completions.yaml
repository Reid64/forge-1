project: benavora
github_repo: Reid64/benavora
supabase_project_ref: vbjplpquqxxfbpazyalt
vercel_project_name: benavora
domain: benavora.com

governance:
  - BLUEPRINT_v2.md
  - SCHEMA_REGISTRY_v2.md
  - BEHAVIORAL_CONTRACTS.md
  - STATE_OF_THE_BUILD_2026-09-01.md
  - STANDING_DIRECTIVES.md

settings:
  max_retries_per_prompt: 3
  build_model: claude-sonnet-4-6-20250514
  review_model: claude-sonnet-4-6-20250514
  report_model: claude-haiku-4-5-20251001
  permission_mode: acceptEdits
  allowed_tools: "*"

prompts:

  - id: p2-001-board-packet-agent-refresh
    phase: completion
    description: "Refresh Board Packet Agent to consume PIL dossiers and generate current board context"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: Board Packet Agent exists but pulls from stale pil_prospects table (no intelligence). Must be rewired to consume from pil_prospect_dossiers (fully enriched, scored, ranked).
      
      FIX SCOPE:
      1. Read src/lib/pil/agents/app/BEN-APP-01.ts (Application Profile Orchestrator) to understand dossier structure.
      2. Find board-packet-agent.ts. Read it in full.
      3. Update data source: change pil_prospects queries to pil_prospect_dossiers queries.
      4. Board packet should include: prospect profile, relationship score, success probability, priority recommendation, personalized pitch, risk factors, relationship strategy.
      5. Generate board packet in markdown format with sections: Executive Summary, Prospect Profile, Intelligence Summary, Recommendation, Next Steps.
      6. Add route POST /api/agents/board-packet accepting { prospect_id } and returning { board_packet_markdown, generated_at }.
      7. Test: Create test prospect with full dossier. Generate board packet. Verify all sections populated with dossier data.
      8. Commit: git add -A; git commit -m "fix(agents): refresh board-packet-agent to consume PIL dossiers"
      
      VERIFICATION:
      - Agent reads from pil_prospect_dossiers
      - Board packet includes all 6 sections
      - Route /api/agents/board-packet functional
      - Test packet generated with real dossier data
      
    gates:
      - type: compile
    max_retries: 3
    on_fail: stop
    depends_on: []

  - id: p2-002-email-intelligence-gmail-webhook
    phase: completion
    description: "Wire Gmail webhook to email intelligence agent (currently dead-letter)"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: Email intelligence agent exists but no webhook receives emails from Gmail. Emails sent to funder contacts never analyzed for intelligence.
      
      FIX SCOPE:
      1. Read src/lib/agents/email-intelligence-agent.ts in full.
      2. Check if webhook exists: ls -la src/app/api/webhooks/gmail/route.ts
      3. If missing, create it: POST /api/webhooks/gmail receiving Gmail push notifications (topic: projects/benavora/topics/gmail-emails).
      4. Webhook must: extract sender (funder contact), subject, body, date; call EmailIntelligenceAgent; store analysis in email_intelligence table.
      5. EmailIntelligenceAgent should: extract funder sentiment, funding signals, relationship cues, next-step indicators.
      6. Update contact.last_contacted_at when email received.
      7. Test: Send test email from external account to your org email. Verify webhook fires, analysis stored in email_intelligence table.
      8. Commit: git add -A; git commit -m "fix(webhooks): wire Gmail webhook to email intelligence agent"
      
      VERIFICATION:
      - Webhook route exists at /api/webhooks/gmail
      - Accepts Gmail push notifications
      - Invokes EmailIntelligenceAgent
      - email_intelligence table populated
      - Test email analyzed within 2 minutes
      
    gates:
      - type: compile
    max_retries: 3
    on_fail: stop
    depends_on: []

