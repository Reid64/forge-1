    max_retries: 3
    on_fail: stop
    depends_on: []

  - id: p2-005-donation-marketplace-ai-matching
    phase: completion
    description: "Complete donation marketplace AI matching algorithm (currently stub)"
    prompt: |
      Project root: C:\Users\manag\Documents\benavora
      
      PARTIAL COMPLETION: Donation Marketplace agent exists. Matching logic is stub (returns all opportunities). No scoring, no ranking.
      
      FIX SCOPE:
      1. Read src/lib/agents/donation-marketplace-agent.ts in full.
      2. Implement matching algorithm: for each funder, score all opportunities on:
         - Category match (funder.category vs opportunity.category): 0-30 points
         - Geographic alignment (funder.geographic_focus vs opportunity.service_area): 0-25 points
         - Funding size alignment (funder.annual_giving_budget vs opportunity.requested_amount): 0-20 points
         - Relationship status (funder relationship_score): 0-15 points
         - Strategic priority (org priority vs funder focus): 0-10 points
      3. Rank opportunities by total score (0-100).
      4. Return top 10 matches with scores and explanation for each.
      5. Test: Create test funder with known preferences. Run matcher. Verify top matches align with preferences.
      6. Create route POST /api/agents/donation-marketplace-match accepting { funder_id } and returning ranked opportunities.
      7. Commit: git add -A; git commit -m "feat(agents): implement donation marketplace AI matching with scoring"
      
      VERIFICATION:
      - Matching algorithm implemented with 5 scoring factors
      - Scores reasonable (0-100 range)
      - Top matches make sense for test funder
      - Route functional
      - Test verified with real data
      
    gates:
      - type: compile
    max_retries: 3
    on_fail: stop
    depends_on: []

  - id: p2-006-search-profiles-ui-fix
