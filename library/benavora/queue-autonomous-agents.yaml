- id: gov-002
  name: Update BEHAVIORAL_CONTRACTS.md with autonomous contracts
  prompt: |
    Read BEHAVIORAL_CONTRACTS.md in full.
    Read src/lib/agents/autonomous-base.ts (specifically AUTONOMOUS_HARD_LIMITS).

    Append the following new sections to BEHAVIORAL_CONTRACTS.md (do not modify existing sections 1-15):

    ## 16. Autonomous Agent Contracts

    ### Hard Limits (absolute -- no exceptions, no operator overrides)
    - Autonomous agents NEVER submit applications or forms to external funders without explicit human approval
    - Autonomous agents NEVER send emails to external parties without human approval
    - Autonomous agents NEVER delete user data of any kind
    - Autonomous agents NEVER modify governance files
    - Autonomous agents NEVER exceed org max_auto_drafts_per_night limit
    - Autonomous agents NEVER access data outside org scope (organization_id isolation enforced equally)
    - All of the above are enforced as TypeScript constants in AUTONOMOUS_HARD_LIMITS and as behavioral patterns in every agent class

    ### Decision Logging Requirements
    - Every autonomous decision MUST create an agent_decisions record BEFORE executing the action
    - decision_type, reasoning, confidence_score, and action_taken are required on every record
    - Any action with requiredHumanReview=true creates a blocking notification immediately
    - Decisions with confidence_score < 60 automatically set requiredHumanReview=true

    ### Chain Contract
    - Agent chaining is one-directional: AG-17 -> AG-15 -> AG-05 (never circular)
    - A chained agent only fires if the upstream agent completed successfully
    - Maximum chain depth: 3 (discovery -> scoring -> drafting)
    - Chain payload always includes the triggering agent's run_id for full traceability

    ### Human Review Gates
    - All auto-generated drafts: auto_generated=true, pending_review=true
    - A pending_review=true application cannot advance past 'drafting' stage (API enforces this)
    - Only owner or admin role can clear pending_review
    - Clearing pending_review creates a pipeline_history record: 'Autonomous draft approved by {user}'

    ### Notification Contracts
    - Morning digest fires at 7:00 AM CST regardless of pipeline activity
    - CRITICAL reputation alerts fire immediately (not batched)
    - Maximum 1 digest notification per org per day
    - All autonomous notifications link to the relevant review page

    ## 17. Autonomous Configuration Contracts
    - org_autonomous_config created with all flags=false on org creation (opt-in default)
    - auto_draft_threshold below 50 is blocked by API validation
    - Disabling auto_research_enabled also disables auto_score_enabled and auto_draft_enabled
    - Only owner role can modify autonomous config
    - Config changes take effect at the next nightly pipeline run

    Save updated file.
    Commit: git add BEHAVIORAL_CONTRACTS.md; git commit -m 'docs: BEHAVIORAL_CONTRACTS.md sections 16-17 autonomous agent contracts'; git push.

