  name: Create AUTONOMOUS_PLATFORM_VISION.md
  prompt: |
    Read BLUEPRINT_v2.md in full.
    Read PLATFORM_VISION_ARCHITECTURE.md in full.
    Read FEATURE_REGISTRY_v2.md in full.

    Create AUTONOMOUS_PLATFORM_VISION.md in the repo root.

    # BENAVORA -- Autonomous Platform Vision
    ## Version: 1.0 | Date: July 19, 2026 | Status: POST-LAUNCH ROADMAP

    ## The Strategic Thesis
    Today's fundraising platforms automate tasks. The next generation automates outcomes. Benavora's trajectory: from AI-assisted grant management (Phase 1) to autonomous fundraising operating system (Phase 5). The nonprofit simply approves major decisions.

    ## The Four Moats (Why This Is Defensible)
    1. Proprietary fundraising knowledge graph: learns from millions of interactions -- language, budget structure, narrative, keywords, timing. Cannot be replicated without the data history.
    2. Predictive intelligence: identifies funding before it becomes obvious. Monitors signals others ignore.
    3. Autonomous orchestration: not isolated tools but coordinated agents executing the entire funding lifecycle.
    4. Cross-organization network effects: each customer's anonymized successes improve recommendations for all others. Value grows non-linearly with user count.

    ## Phase 1 -- Foundation (Current: Launch through Month 6)
    What is operational: autonomous discovery pipeline (AG-17->AG-15->AG-05), 18 autonomous agents, decision logging, morning digest, settings panel, draft review interface. Metrics defining Phase 1 completion: 50 paying orgs, first 1,000 autonomous drafts generated, NPS > 50.

    ## Phase 2 -- Intelligence Amplification (Months 7-18)
    For each feature below include: description, FORGE queue blueprint (3-5 sentences on prompts needed), schema additions required, agent(s) involved.

    Features:
    - Fundability Intelligence Score: probability score with explanation of specific deficiencies and auto-fix where possible
    - AI Donor Intent Engine: monitor press releases, CSR, ESG reports, SEC filings, hiring trends, facility expansions, disaster declarations, foundation board appointments. Predict giving intent 30-90 days before announcement.
    - Twin-Powered Draft Generation: every draft reads Digital Twin completeness first, fills gaps from KB, generates with full organizational context
    - AutoApply Full Autonomous Mode: overnight queue, 400+ corporate portal submissions, zero human touch for standard forms
    - Predictive National Opportunity Forecasting: congressional appropriations, FEMA spending, HUD, USDA, state budgets, corporate profits, industry cycles

    ## Phase 3 -- Relationship Intelligence (Months 19-30)
    - Corporate Relationship Graph: board overlaps, alumni networks, church/university connections, past employers, family foundations, shared board members. Surface warm introduction pathways.
    - Philanthropic Intelligence Graph: full build-out, cross-org funder behavior patterns, giving cycle intelligence
    - Autonomous Partnership Discovery: identify coalition grant opportunities, complementary missions, shared application potential
    - Donor Personalization Engine: website and communications adapt by visitor type automatically (corporate exec vs church donor vs family foundation vs government reviewer)
    - Community Need Prediction: census data, housing prices, employment trends, eviction filings, weather patterns, school enrollment, migration data

    ## Phase 4 -- Autonomous Operations (Months 31-48)
    - Global Learning Network: every successful grant (anonymized) teaches platform language, budget structure, narrative patterns, winning keywords. Proprietary moat competitors cannot replicate.
    - Predictive Fundraising Simulator: what-if modeling -- increase board members, hire staff, expand geography, launch program. AI projects revenue, probability, cost, ROI, staffing needs across scenarios.
    - Autonomous Continuous Improvement Engine: nightly self-assessment. What worked, what failed, which agents underperformed, which prompts improved. Proposes enhancements, validates in staging, A/B tests, presents high-confidence improvements for approval before deployment.
    - Autonomous Multi-Agent Negotiation: AI-to-AI communication with corporate giving portals for documentation alternatives and requirement clarification.
    - Community Resource Graph (Faith Foundation model): map donors, housing providers, churches, government agencies, volunteers, contractors, property owners, employers, transportation. Shortest path from client need to resource combination.
    - ROI Optimization Engine: track every submission variable -- prompt version, attachment type, submission day, wording choices, contact person. Continuous optimization loop.

    ## Phase 5 -- Network Effects (Month 49+)
    - Cross-organization anonymous benchmarking
    - Industry-wide success pattern detection by funder, category, geography
    - Predictive national funding flow modeling
    - AI Strategic Advisor: proactive unsolicited recommendations before the user asks. 'Apply for these 12 grants next month.' 'Postpone this application.' 'This foundation funded exactly your profile 3 times in the last 2 years.'

    ## FORGE Queue Blueprints
    For each Phase 2-5 feature: describe the specific FORGE queue prompts (schema migration, agent, API route, UI) needed to execute the build in a future session.

    ## Competitive Moat Analysis
    For each of the four moats: current state, what competitor would need to replicate, estimated time to replicate, why the gap widens over time.

    Save as AUTONOMOUS_PLATFORM_VISION.md.
    Commit: git add AUTONOMOUS_PLATFORM_VISION.md; git commit -m 'docs: AUTONOMOUS_PLATFORM_VISION.md -- post-launch roadmap Phases 1-5 with FORGE blueprints'; git push.

