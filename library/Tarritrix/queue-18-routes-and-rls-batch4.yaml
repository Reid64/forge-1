# QUEUE 18 — Route Gate-Failure Fixes (route-004/005/008) + Pattern A RLS Batch 4 (24 tables, applied)
#
# PART A — route-004-fix, route-005-fix, route-008-fix (queue-15's now-failed prompts, corrected shape)
#
# Root cause (verified 2026-07-29, not guessed): `gates/file_exists.ps1` called
# `Test-Path $full` without `-LiteralPath`. PowerShell's Test-Path treats `[` and `]` as
# wildcard character-class syntax, so a literal path containing a Next.js dynamic-route folder
# like `[id]` was being interpreted as "match a single character that is i or d" instead of the
# literal three characters — a guaranteed false negative on every bracketed path. This was
# confirmed directly: all 6 target files below already exist on disk, already compile clean,
# and are already committed (`15c85e3` route-004, `d018ab6` route-005, `077bbab` route-008,
# each from the original 2026-07-29 09:50 queue-15 run) — the FORGE orchestrator log
# (`reports/orchestrator_Tarritrix_2026-07-29_09-50-57.log`) shows `compile: PASS` immediately
# followed by `file_exists: FAIL - Missing: ...` for the exact same paths that were just
# written, 3 retries each, all with identical false-negative output. This is a FORGE gate
# defect, not an implementation defect — the original build agent's work was already correct.
#
# Fix applied directly to `gates/file_exists.ps1` in this same session (added `-LiteralPath`),
# not deferred to a queue prompt, since it's shared infrastructure and not project-specific
# content. The three prompts below reuse queue-15's original target files and spec verbatim —
# no content changed, only the gate that checks them. If the build agent finds the files already
# correct (likely, since they already exist), expect a no-op commit (nothing to stage) rather
# than a rewrite — that is the correct, safe outcome, matching how the Batch 2 rerun behaved
# earlier this session when it found its own target migration file already in place.
#
# PART B — RLS Batch 4 (24 tables): written AND applied, not write-only
#
# Departure from Batch 1/2/3 convention, per explicit operator instruction this session: Batch 4
# is applied via Supabase MCP in the same queue, not left "written, not applied" pending separate
# authorization. rls-batch4-001's migration SQL below was authored using the same live-check
# discipline as Batch 2/3 — every DROP POLICY name was pulled directly from a `pg_policies`
# query against project `jhiplicikizdpdsguimg` run in this session (not guessed, not inferred
# from naming convention). Six of the 24 tables carry a second policy alongside the operator_id
# one that must NOT be touched: `cities`/`services`/`signal_leads` each keep a
# `clients_select_own_<table>` Pattern B policy; `client_evidence_progress` keeps
# `System can insert/update evidence progress` (qual=true); `conversions` keeps both
# `anon_can_insert_conversions` (public form INSERT) and `clients_select_own_conversions`.
# Write-path safety re-verified same as every prior batch: grepped src/ for every non-service-role
# write to all 24 tables — exactly one match (`src/agents/a-09-conversion-recorder/index.ts`,
# writing to `conversions`), confirmed to use `getAgentSupabaseClient()` (service role, bypasses
# RLS). A SELECT-only Pattern A policy is a safe, complete replacement for operator-side read
# access on all 24 tables, consistent with Batches 1-3.
#
# rls-batch4-002 applies the migration live and verifies it — this is a live-database mutation,
# gated on the build agent actually having Supabase MCP tool access in its own session. Per this
# session's own flagged recurring gap (STATE_OF_THE_BUILD.md, SCHEMA_REGISTRY.md, 2026-07-29:
# FORGE-launched sessions have inconsistently lacked Supabase MCP permission), the prompt
# instructs the same fallback discipline used when that gap was previously hit: if MCP access
# isn't available, decline to assert success rather than guess, and say so plainly in the commit
# report and governance update.

