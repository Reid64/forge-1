    Write FILE 1: C:\Users\manag\Documents\Tarritrix\src\app\api\clients\[id]\health\route.ts

    GET handler. getOperatorContext() auth, client_id from the URL param verified against operator-visible clients (never trust the param alone — Contract 5). Query client_penalty_risk_composite for this single client_id. Return exactly the view's columns.

    Write FILE 2: C:\Users\manag\Documents\Tarritrix\src\app\api\clients\[id]\page-metrics\route.ts

    GET handler. Same auth pattern. Query page_metrics for all pages belonging to this client_id. Return per-page metrics as stored (views_total, views_30d, views_7d, views_24h, conversions_total, conversion_rate_30d, performance_tier — verify exact column list against SCHEMA_REGISTRY.md before writing the select).

    pnpm tsc --noEmit — 0 errors.

    git add -A; git commit --no-verify -m 'feat: per-client health and page-metrics API routes'; git push origin main. Report commit hash, or report explicitly that there was nothing to commit if both files were already present and correct.
