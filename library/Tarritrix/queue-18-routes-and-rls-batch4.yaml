- id: rls-batch4-002
  name: Apply Batch 4 RLS Migration via Supabase MCP and Verify Live
  prompt: |
    Verify Test-Path 'supabase\migrations\20260729120000_pattern_a_batch4_niche_vertical.sql' returns True. pnpm tsc --noEmit — 0 errors.

    If Supabase MCP tool access is available in this session: apply the migration to project jhiplicikizdpdsguimg via the Supabase MCP apply_migration tool. Then run this exact verification query via the Supabase MCP execute_sql tool:

    SELECT tablename, policyname, cmd, qual FROM pg_policies WHERE schemaname='public' AND tablename IN ('ai_visibility_scores','cities','claimed_facts','client_brand_signatures','client_evidence_progress','client_storm_subscriptions','conversions','domains','evidence_items','extracted_evidence','gbp_posts','gbp_profiles','invoices','job_content_linkage','job_evidence','qa_seeds','retargeting_events','review_requests','review_response_drafts','service_area_heatmaps','services','signal_leads','subscriptions','xactimate_rewrite_requests') AND qual ILIKE '%operator_id%';

    This query must return zero rows. Report the query result verbatim. If it returns any row, the migration did not fully apply — stop, do not update governance docs, and report the exact table(s) still showing operator_id-based policies as a blocker.

    If Supabase MCP tool access is NOT available in this session: do not attempt supabase db push as a substitute, do not guess at the live state, and do not claim the migration was applied. Report explicitly that MCP access was unavailable, matching the same disclosure this session already used for the Batch 2 status correction (STATE_OF_THE_BUILD.md, 2026-07-29 entry) — leave the migration file's status as WRITTEN, NOT YET APPLIED and stop here without touching SCHEMA_REGISTRY.md's Batch 4 status line.

    Only if the verification query above returned zero rows: update SCHEMA_REGISTRY.md's Batch 4 bullet to APPLIED AND VERIFIED, matching the exact phrasing convention used for the Batch 2 correction (state the query was run, state the zero-row result, name the tables that retain a second untouched policy: cities/services/signal_leads keep clients_select_own_<table>, client_evidence_progress keeps "System can insert/update evidence progress", conversions keeps anon_can_insert_conversions and clients_select_own_conversions). Update the outstanding-table count line to reflect Batches 1-4 all migrated (0 remaining).

    Append a new session log entry to STATE_OF_THE_BUILD.md (do not edit or remove any prior entry — Contract 77 append-only) recording the migration application, the verbatim verification query and result, and the corrected outstanding count.

    git add -A; git commit --no-verify -m 'feat: apply Pattern A RLS migration Batch 4 — 24 niche/vertical tables, live-verified zero Pattern C remnants'; git push origin main. Report commit hash, or report explicitly that no commit was made if MCP access was unavailable and nothing changed.
  gates:
  - type: compile
