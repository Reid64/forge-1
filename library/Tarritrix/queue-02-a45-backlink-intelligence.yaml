governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
project: tarritrix-senior-agents
prompts:
- id: a45-senior-001
  name: A-45 Backlink Intelligence Engine - Full Schema (Profile, Gap, Opportunities, Risk)
  prompt: "Read SCHEMA_REGISTRY.md, AGENTS.md, STATE_OF_THE_BUILD.md, BEHAVIORAL_CONTRACTS.md Contract 60 (Backlink Operations Strict Whitelist), and src/lib/agents/a-24-competitive-intelligence.ts (if it exists yet from this session's earlier build - it establishes the exact credential-detection-and-honest-gating pattern A-45 must reuse) first.\n\nMISSION (per full operator spec, implement every listed capability): A-45 is the backlink intelligence, competitive gap, and opportunity-ranking engine. It normalizes Ahrefs/SEMrush/Majestic data into one internal schema, operates in LIMITED INTELLIGENCE MODE with zero fabrication when no provider credential exists, and strictly never engages in paid links, PBNs, spam outreach, fake guest posting, or automated account creation - Contract 60's whitelist boundary is absolute.\n\nDATA MODEL:\n\nCREATE TABLE IF NOT EXISTS backlink_profile (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  referring_domain text NOT NULL,\n  target_url text NOT NULL,\n  anchor_text text,\n  link_status text NOT NULL CHECK (link_status IN ('active','lost','broken','redirected')),\n  domain_authority numeric(5,2),\n  is_toxic_flagged boolean NOT NULL DEFAULT false,\n  data_source text NOT NULL CHECK (data_source IN ('ahrefs','semrush','majestic','gsc','internal')),\n  first_seen_at timestamptz NOT NULL DEFAULT now(),\n  last_checked_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS backlink_competitor_gap (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  competitor_domain text NOT NULL,\n  referring_domain text NOT NULL,\n  links_to_competitor boolean NOT NULL DEFAULT true,\n  links_to_client boolean NOT NULL DEFAULT false,\n  gap_value_score numeric(5,2),\n  detected_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS backlink_opportunity_queue (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  opportunity_type text NOT NULL CHECK (opportunity_type IN ('unlinked_mention','broken_link_replacement','reclamation','competitor_gap')),\n  target_domain text NOT NULL,\n  authority_score numeric(5,2),\n  topical_relevance_score numeric(5,2),\n  geographic_relevance_score numeric(5,2),\n  acquisition_likelihood_score numeric(5,2),\n  spam_risk_score numeric(5,2) NOT NULL,\n  composite_rank numeric(5,2) NOT NULL,\n  status text NOT NULL DEFAULT 'identified' CHECK (status IN ('identified','recommended','dismissed')),\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS backlink_risk_report (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  risk_type text NOT NULL CHECK (risk_type IN ('toxic_pattern','velocity_spike','irrelevant_cluster','anchor_concentration')),\n  detail jsonb NOT NULL,\n  severity text NOT NULL CHECK (severity IN ('low','medium','high')),\n  detected_at timestamptz NOT NULL DEFAULT now()\n);\n\nRLS Pattern A, service_role only, all 4 tables. Apply live against project tarritrix (jhiplicikizdpdsguimg). Update SCHEMA_REGISTRY.md, status APPLIED AND LIVE-VERIFIED with real evidence. Run pnpm tsc --noEmit. Commit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - path: SCHEMA_REGISTRY.md
      path_class: shared_canonical
- id: a45-senior-002
  name: A-45 Full Implementation - Diagnosis-Before-Retry, Multi-Provider Normalization, Contract 60 Enforcement
  prompt: "Read A-24's real credential-detection pattern (checking AHREFS_API_KEY at runtime, honest data_source='unavailable' fallback) and the schema applied in the previous prompt first - reuse A-24's exact runtime-credential-check pattern, do not reinvent it.\n\nImplement src/lib/agents/a-45-backlink-intelligence-engine.ts as a BaseAgent subclass:\n\ninterface A45Input {\n  client_id: string;\n  competitor_domains?: string[];\n}\n\ninterface A45Output {\n  status: 'COMPLETED' | 'PARTIALLY_COMPLETED' | 'LIMITED_INTELLIGENCE_MODE';\n  data_source_used: 'ahrefs' | 'semrush' | 'majestic' | 'none';\n  backlink_health_score: number | null;\n  new_backlinks_found: number;\n  lost_backlinks_found: number;\n  opportunities_ranked: number;\n  risk_flags_raised: number;\n}\n\nDIAGNOSIS-BEFORE-RETRY ERROR TAXONOMY (implement as a real discriminated union, this is the core engineering standard here):\n- NO_PROVIDER_CONFIGURED (non-error, expected) - none of AHREFS_API_KEY/SEMRUSH_API_KEY/MAJESTIC_API_KEY present. Enter LIMITED_INTELLIGENCE_MODE: still run internal-database-only analysis (backlink_profile rows already on file, GSC link data if available) but never claim external-provider-quality intelligence.\n- PROVIDER_RATE_LIMITED (retryable, max 3, backoff base 60s, respect the provider's real Retry-After header if present, don't guess a fixed backoff blindly)\n- PROVIDER_AUTH_FAILED (non-retryable, distinct from rate-limited - a bad/expired key needs a human to fix, not a retry)\n- MALFORMED_PROVIDER_RESPONSE (retryable once, log raw response, then fall back to LIMITED_INTELLIGENCE_MODE rather than failing the whole run)\n\nPIPELINE:\n\n1. detectProvider(): check env for AHREFS_API_KEY, SEMRUSH_API_KEY, MAJESTIC_API_KEY in that priority order (Ahrefs first if multiple present - state this priority choice explicitly). Apply NO_PROVIDER_CONFIGURED honest fallback if none found - this must be a real, complete, tested code path, not a stub.\n\n2. normalizeProviderData(rawResponse, provider): write one internal normalizer function per provider that maps each vendor's real response shape to the common backlink_profile columns - do not write generic code that assumes all three vendors return the same field names, they don't; implement each mapping explicitly even if only one is exercisable right now without a live key.\n\n3. detectNewAndLostLinks(client_id, freshData): diff against existing backlink_profile rows for this client, mark newly-seen domains, mark previously-active domains no longer present as link_status='lost'.\n\n4. detectRiskPatterns(client_id): real, code-level heuristics, not LLM judgment - anchor-text concentration (>40% of links using identical anchor text is a real, checkable red flag), velocity spike (>3x the client's own trailing-90-day average new-link rate in a single week), irrelevant cluster (a real geographic/topical mismatch check against the client's own service area and industry). Write real backlink_risk_report rows only when a real threshold is crossed, with the actual numbers in the detail jsonb, not a vague flag.\n\n5. computeCompetitorGap(client_id, competitor_domains): for each provided competitor domain, identify referring domains linking to the competitor but not the client - real domain-set difference logic, write to backlink_competitor_gap.\n\n6. rankOpportunities(client_id): score every candidate (competitor gaps, unlinked mentions if A-13's brand_mentions table has any with is_linked=false, broken-link candidates from lost backlinks) across authority/topical/geographic/acquisition-likelihood/spam-risk, compute composite_rank as a real weighted formula (state the weights explicitly and why), write to backlink_opportunity_queue.\n\n7. STRICT CONTRACT 60 ENFORCEMENT: this agent NEVER writes an outbound email, NEVER creates an external account, NEVER submits a form, NEVER automates any acquisition action - it only identifies and ranks. Confirm and state in your report that zero external-write side effects exist anywhere in this implementation, only internal DB writes and (when a real key exists) read-only API calls to the backlink data provider.\n\n8. Full Contract 69 error capture. Real cost tracking if provider API calls have a real cost (most backlink APIs bill per-call, check if a cost-tracking mechanism should apply here similar to LLM cost tracking).\n\nCreate src/app/api/agents/a-45/trigger/route.ts, standard operator auth.\n\nTEST MATRIX in tests/unit/agents/a-45.test.ts:\n- NO_PROVIDER_CONFIGURED: full LIMITED_INTELLIGENCE_MODE path using only internal data, correct status returned, zero fabricated metrics\n- PROVIDER_AUTH_FAILED vs PROVIDER_RATE_LIMITED: confirm these are handled distinctly (one retries, one doesn't)\n- Anchor-concentration risk detection crossing and not crossing the real threshold\n- Velocity-spike detection against a synthetic 90-day baseline\n- Competitor gap computation with a known synthetic domain set\n- Opportunity ranking produces genuinely differentiated composite_rank values, not identical scores\n- Confirm zero external side-effect calls anywhere in the codebase path this agent executes (a real test asserting no email/fetch-to-external-write occurs)\n\nRun pnpm tsc --noEmit and pnpm vitest run tests/unit/agents/a-45.test.ts - both clean. Check agent_name enum and permission-matrix sync proactively.\n\nUpdate STATE_OF_THE_BUILD.md and AGENTS.md, SHIPPED+WIRED, explicitly confirming Contract 60's strict whitelist boundary is enforced by construction, not just by prompt instruction, and noting which provider (if any) was live-testable given current credentials.\n\nCommit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-45-backlink-intelligence-engine.ts
    - src/app/api/agents/a-45/trigger/route.ts
    - tests/unit/agents/a-45.test.ts
