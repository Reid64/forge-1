- id: ux-technical-seo-001
  name: Command Center UX - Technical SEO Group Descriptions and A-44 Disambiguation
  prompt: "Read docs/design/tarritrix-command-center.html's renderTechnical() function in full first - it is confirmed to be the exact single function serving all 7 keys: site-audits, crawling, indexation, schema, redirects, canonicals, page-experience (lines 1251-1257 route all 7 to it; body at lines 2195-2221). This is the actual, confirmed reason these pages read as confusingly identical - they ARE the identical function, differentiated only by nav label, not content.\n\nAlso read src/app/api/dashboard/technical-issues/route.ts in full - the real backend confirmed to serve this shared render, computing 5 of 15 TECH_ISSUES rows live (duplicate titles, duplicate bodies, missing schema, robots directives, thin pages) with the other 10 returning null/'Not yet tracked' honestly.\n\nTHE ACTUAL UX PROBLEM, precisely: an operator navigating to any of these 7 nav items sees the identical 'Technical Operations Center' page with an identical 'Run Full Crawl' button, with no indication these 7 nav entries currently produce the same content, and no explanation of what A-44 (Knowledge Ingestion - a completely different concept, brand data extraction) has to do with 'Run Full Crawl' shown on this page versus the Work Queues section below it (real technical SEO health checks, unrelated to A-44).\n\nFIX (React component, not the static HTML mockup - find the real live component that renders this shared page, likely TechnicalOperationsSection.tsx or similar per this session's earlier work tonight, grep for it):\n1. Add a short (2-3 sentence) description block directly under the page title, specific to which of the 7 nav keys is currently active (site-audits/crawling/indexation/schema/redirects/canonicals/page-experience) - even though they share one render function, the description text should differ per key to at least explain what an operator should expect to eventually see different here, and to explicitly name which of the 15 Work Queue rows are real (live-computed) versus not-yet-tracked, rather than leaving that distinction only visible by noticing which counts say null.\n2. On the 'crawling' key specifically, add explicit clarifying text distinguishing 'Run Full Crawl' (A-44 Knowledge Ingestion - extracts brand data, credentials, badges for real page generation, a completely separate concept) from the Work Queues section below it (technical SEO health checks - duplicate titles, missing schema, etc, unrelated to A-44). This is the single most-confirmed point of operator confusion from tonight's live testing - be as explicit as needed to actually resolve it, not just gesture at the distinction.\n3. Do not restructure the existing canonical layout - the description block is additive, sitting above the existing panel structure, per REPLICATION_PROTOCOL.md's own rule against altering canonical structure.\n\nRun pnpm tsc --noEmit and any existing e2e test covering these 7 pages (grep tests/e2e for a matching spec file) - must pass.\n\nUpdate STATE_OF_THE_BUILD.md noting this addressed for the Technical SEO group of 7 pages specifically, with the remaining Command Center/Social Command pages (the other ~84 nav items) still open as a known, named follow-up scope.\n\nCommit and push."
  gates:
