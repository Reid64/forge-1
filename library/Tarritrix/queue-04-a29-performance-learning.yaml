governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
project: tarritrix-senior-agents
prompts:
- id: a29-senior-001
  name: A-29 Performance Learning Engine - Full Schema (Baseline, Effectiveness, Experiments, Recommendations)
  prompt: "Read SCHEMA_REGISTRY.md, AGENTS.md, STATE_OF_THE_BUILD.md, and page_performance_daily's real live schema (confirmed to exist, 13,500+ rows per this session's earlier findings) first.\n\nMISSION (per full operator spec): A-29 is the recursive performance-learning layer - it establishes baselines, detects statistically meaningful winners/losers (never premature conclusions from insufficient data - same discipline A-23 already proved tonight with its minimum-sample-size guard), separates correlation from likely causation where possible, and produces evidence-scored recommendations. \n\nHONEST SCOPING (state this explicitly in your final report, this is a real, deliberate boundary, not a shortcut): this build implements the full Observation -> Hypothesis -> Measurement -> Validation -> Recommendation pipeline using real historical data. It does NOT implement live traffic-splitting A/B test execution (assigning live visitors to variants) - that requires real product infrastructure (a feature-flag/traffic-split system) that does not exist anywhere in this codebase yet and is a separate infrastructure decision, not something to fabricate here. Where the spec calls for 'controlled experiments,' this build produces experiment_queue rows as real, evidence-backed proposals for operator/future-infrastructure execution, correctly stopped at NEEDS_HUMAN / recommendation status rather than claiming to have run a live experiment that did not happen.\n\nDATA MODEL:\n\nCREATE TABLE IF NOT EXISTS performance_baseline (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  segment_type text NOT NULL CHECK (segment_type IN ('tenant','city','service','page_type','template','publish_cadence','schema_type')),\n  segment_value text NOT NULL,\n  metric_name text NOT NULL CHECK (metric_name IN ('impressions','clicks','ctr','avg_position','conversions')),\n  baseline_value numeric(12,4) NOT NULL,\n  baseline_window_start date NOT NULL,\n  baseline_window_end date NOT NULL,\n  sample_size integer NOT NULL,\n  established_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS strategy_effectiveness (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid,\n  strategy_description text NOT NULL,\n  segment_type text NOT NULL,\n  segment_value text NOT NULL,\n  metric_name text NOT NULL,\n  change_percent numeric(8,4) NOT NULL,\n  sample_size integer NOT NULL,\n  statistical_confidence numeric(4,3) NOT NULL,\n  is_statistically_meaningful boolean NOT NULL,\n  classification text NOT NULL CHECK (classification IN ('winner','loser','inconclusive')),\n  is_tenant_specific boolean NOT NULL DEFAULT true,\n  computed_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS experiment_queue (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid REFERENCES clients(id),\n  hypothesis text NOT NULL,\n  proposed_change text NOT NULL,\n  evidence_summary text NOT NULL,\n  evidence_confidence_score numeric(4,3) NOT NULL,\n  status text NOT NULL DEFAULT 'proposed' CHECK (status IN ('proposed','needs_infrastructure','operator_approved','rejected')),\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS next_best_action_recommendation (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  page_id uuid REFERENCES pages(id),\n  recommendation_type text NOT NULL CHECK (recommendation_type IN ('content_adjustment','publishing_rate_change','internal_link_change','schema_change','page_refresh','consolidation','expansion','pause_rollback')),\n  reasoning text NOT NULL,\n  evidence_confidence_score numeric(4,3) NOT NULL,\n  is_high_impact boolean NOT NULL DEFAULT false,\n  requires_approval boolean NOT NULL DEFAULT false,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nRLS Pattern A, service_role only, all 4 tables. Apply live against project tarritrix (jhiplicikizdpdsguimg). Update SCHEMA_REGISTRY.md, status APPLIED AND LIVE-VERIFIED. Run pnpm tsc --noEmit. Commit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - path: SCHEMA_REGISTRY.md
      path_class: shared_canonical
- id: a29-senior-002
  name: A-29 Full Implementation - Statistical Rigor, Confound Detection, Cross-Tenant Guard
  prompt: "Read page_performance_daily's real column shape and A-23's real minimum-sample-size statistical guard (built earlier this session - reuse its exact discipline: never classify a winner/loser from a tiny sample, regardless of how large the percentage swing looks) first.\n\nImplement src/lib/agents/a-29-performance-learning-engine.ts as a BaseAgent subclass:\n\ninterface A29Input {\n  scope: { type: 'client'; client_id: string } | { type: 'platform' };\n}\n\ninterface A29Output {\n  status: 'COMPLETED' | 'PARTIALLY_COMPLETED';\n  baselines_established: number;\n  winners_detected: number;\n  losers_detected: number;\n  inconclusive_insufficient_data: number;\n  recommendations_generated: number;\n  high_impact_recommendations_flagged_for_approval: number;\n  experiment_proposals_created: number;\n}\n\nSTATISTICAL RIGOR REQUIREMENT (the core engineering standard for this agent, matching A-23's proven pattern exactly):\n\n1. establishBaselines(scope): for each real segment (tenant/city/service/page_type/template/publish_cadence/schema_type - query page_performance_daily grouped by the real columns backing each), compute a real baseline over a defined trailing window (use 90 days, matching A-23's window choice for consistency across the platform's statistical conventions). Require a minimum sample_size (use 30, a real statistical minimum for meaningful percentage-change detection, not an arbitrary small number) before writing any performance_baseline row - segments below this threshold are skipped, not baselined on insufficient data.\n\n2. classifyWinnersLosers(client_id_or_platform): for each segment with an established baseline, compare a recent window against it. change_percent = real percentage difference. statistical_confidence: implement as a real function of both sample_size and consistency of the effect (reuse the same sub-window-consistency-check pattern A-23 used for its direction_confidence, applied here to performance metrics instead of sentiment). is_statistically_meaningful = true only when sample_size >= 30 AND abs(change_percent) exceeds a real, stated threshold (use 15%, matching A-23's own notable-shift threshold for platform consistency) AND statistical_confidence >= 0.5. classification = 'winner'/'loser' only when is_statistically_meaningful is true, otherwise 'inconclusive' - this classification-gating logic is the single most important correctness requirement in this file, write a dedicated, independently-tested pure function for it, do not inline it into the main loop.\n\n3. separateCorrelationFromCausation(strategy_row): where multiple segments changed simultaneously (e.g. a publish-cadence change AND a schema change happened in the same window), flag this explicitly as reduced confidence rather than attributing the full effect to one strategy - implement a real check: if more than one tracked strategy variable changed in the same baseline-to-current window for a segment, cap statistical_confidence for that row (e.g. multiply by 0.5) and note the confound in a text field, rather than silently attributing full causal credit.\n\n4. preventCrossTenantContamination: strategy_effectiveness rows must always carry is_tenant_specific correctly. When computing platform-wide learning (scope.type === 'platform'), only promote a pattern to platform-level significance if it holds across a real minimum number of independent tenants (use 3), not from one tenant's anomalous result - implement and test this explicitly, since the spec calls this out as a hard requirement ('prevent one tenant's anomalous results from automatically becoming global policy').\n\n5. generateRecommendations(winners, losers): for each real winner, propose expansion/replication as a next_best_action_recommendation; for each real loser, propose pause_rollback or content_adjustment. Every recommendation must carry the real evidence_confidence_score from step 2 - a recommendation is never generated with fabricated confidence.\n\n6. flagHighImpact(recommendation): mark requires_approval=true for any recommendation affecting more than a real threshold (e.g. >20 pages, or platform-wide scope) - high-impact changes are never auto-actioned, they surface for operator approval per the spec's governance requirement.\n\n7. proposeExperiments(inconclusive_but_promising_hypotheses): where a pattern shows promise but lacks sufficient evidence, write an experiment_queue row with status='needs_infrastructure' (since live A/B execution infrastructure does not exist yet) rather than fabricating an experiment that was never actually run - this is the honest-scoping boundary stated at the top of this build.\n\n8. Full Contract 69 error capture, zero LLM calls (pure statistical analysis over real historical data - confirm and state this explicitly).\n\nCreate src/app/api/agents/a-29/trigger/route.ts, standard operator auth.\n\nTEST MATRIX in tests/unit/agents/a-29.test.ts:\n- The single most important test: a large percentage swing on a segment with sample_size below 30 must classify as 'inconclusive', never 'winner'/'loser' - matching A-23's own critical test exactly, applied to performance data instead of sentiment\n- A genuinely statistically meaningful winner correctly classified with real confidence\n- Confound detection correctly reduces confidence when multiple strategies changed simultaneously\n- Cross-tenant contamination guard: a pattern true for only 1 tenant does NOT get promoted to platform-level significance; a pattern true across 3+ tenants does\n- High-impact recommendations correctly flagged requires_approval=true\n- Experiment proposals correctly marked needs_infrastructure, never fabricated as executed\n\nRun pnpm tsc --noEmit and pnpm vitest run tests/unit/agents/a-29.test.ts - both clean. Check agent_name enum and permission-matrix sync proactively.\n\nUpdate STATE_OF_THE_BUILD.md and AGENTS.md, SHIPPED+WIRED, explicitly documenting the honest infrastructure-boundary scoping (real analysis and recommendation engine built; live experiment execution correctly deferred as a separate, undecided infrastructure question, not fabricated).\n\nCommit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-29-performance-learning-engine.ts
    - src/app/api/agents/a-29/trigger/route.ts
    - tests/unit/agents/a-29.test.ts
