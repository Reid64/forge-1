governance:
- BLUEPRINT.md
- STATE_OF_THE_BUILD.md
- SCHEMA_REGISTRY.md
- BEHAVIORAL_CONTRACTS.md
- AGENTS.md
project: tarritrix-senior-agents
prompts:
- id: a43-senior-001
  name: A-43 Trust Signal Composer - Full Schema (Matrix, Provenance, Coverage, Missing Evidence)
  prompt: "Read SCHEMA_REGISTRY.md, AGENTS.md, STATE_OF_THE_BUILD.md, src/lib/agents/a-44-knowledge-ingestion.ts, and A-18's job evidence agent (grep for its real file) in full first.\n\nMISSION (per the full operator-provided A-43 spec, implement every capability listed, do not truncate scope): A-43 continuously assembles, scores, validates, and recommends legitimate trust signals per page WITHOUT fabricating authority. It must actively prevent unsupported claims, maintain source provenance for every generated trust statement, detect expired credentials, and request missing evidence from operators rather than silently omitting it.\n\nDATA MODEL - design and apply this exact schema:\n\nCREATE TABLE IF NOT EXISTS trust_signal_matrix (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  page_id uuid NOT NULL REFERENCES pages(id),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  signal_category text NOT NULL CHECK (signal_category IN ('license_insurance','manufacturer_credential','workmanship_warranty','verified_project_evidence','local_project_history','service_area_experience','documented_certification','review_testimonial','association_membership')),\n  signal_value text NOT NULL,\n  relevance_score numeric(4,3) NOT NULL,\n  source_type text NOT NULL CHECK (source_type IN ('a44_ingested_asset','a18_job_evidence','tenant_record','gbp','review_platform')),\n  source_reference_id uuid,\n  expires_at timestamptz,\n  is_expired boolean NOT NULL DEFAULT false,\n  suppressed_reason text,\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS trust_signal_provenance (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  trust_signal_id uuid NOT NULL REFERENCES trust_signal_matrix(id),\n  claim_text text NOT NULL,\n  evidence_source text NOT NULL,\n  evidence_url_or_reference text,\n  verified_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS trust_coverage_scores (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  page_id uuid NOT NULL REFERENCES pages(id),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  trust_coverage_score numeric(5,2) NOT NULL,\n  evidence_strength_score numeric(5,2) NOT NULL,\n  missing_categories text[] NOT NULL DEFAULT '{}',\n  computed_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE IF NOT EXISTS missing_evidence_queue (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  client_id uuid NOT NULL REFERENCES clients(id),\n  page_id uuid REFERENCES pages(id),\n  requested_category text NOT NULL,\n  request_reason text NOT NULL,\n  status text NOT NULL DEFAULT 'pending' CHECK (status IN ('pending','fulfilled','dismissed')),\n  created_at timestamptz NOT NULL DEFAULT now()\n);\n\nRLS Pattern A, service_role only, all 4 tables. Apply live via Supabase MCP against project tarritrix (jhiplicikizdpdsguimg). Confirm via information_schema.columns per table. Update SCHEMA_REGISTRY.md with full column documentation for all 4 tables, status APPLIED AND LIVE-VERIFIED with real query evidence.\n\nRun pnpm tsc --noEmit. Commit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - path: SCHEMA_REGISTRY.md
      path_class: shared_canonical
- id: a43-senior-002
  name: A-43 Full Implementation - Closed-Loop Validation, Anti-Fabrication, Provenance
  prompt: "Read A-44's real client_ingested_assets schema and A-18's real job evidence schema (both confirmed live) and the schema applied in the previous prompt first.\n\nImplement src/lib/agents/a-43-trust-signal-composer.ts as a BaseAgent subclass, matching the exact structural pattern of the existing A-44/A-39/A-41 implementations (same import style, same BaseAgent extension, same error class usage - read one of those files immediately before writing this one to match style exactly).\n\ninterface A43Input {\n  client_id: string;\n  page_id: string;\n}\n\ninterface A43Output {\n  status: 'COMPLETED' | 'PARTIALLY_COMPLETED' | 'NEEDS_HUMAN';\n  trust_coverage_score: number;\n  evidence_strength_score: number;\n  signals_composed: number;\n  signals_suppressed_expired: number;\n  missing_categories: string[];\n  evidence_requests_created: number;\n}\n\nCLOSED-LOOP VALIDATION REQUIREMENT (non-negotiable, this is the core engineering standard for this agent): every trust signal written must be independently re-verified after writing, not just trusted because the insert didn't throw. After each insert into trust_signal_matrix, immediately re-query it by id and confirm the row's signal_value and expires_at match what was intended - if a mismatch is found (e.g. a DB trigger silently truncated a value), this is a real, loggable anomaly, not silently accepted.\n\nPIPELINE:\n\n1. loadAvailableSignals(client_id, page_id): pull real credentials/certifications/manufacturer badges from client_ingested_assets (query the real asset-type column, filter to credential/badge types - confirm the real enum values live before hardcoding a filter), and real EXIF-verified job photos from A-18's evidence tables matching this page's service area.\n\n2. checkExpiry(signal): for any signal with a real expiration date (licenses, certifications, insurance), compare against now(). If expired, set is_expired=true and suppressed_reason='expired credential, auto-suppressed per anti-fabrication requirement' - an expired credential must NEVER be composed into a live trust signal, this is the single most important anti-fabrication rule in this agent.\n\n3. scoreRelevance(signal, page): compute a real relevance_score (0-1) based on whether the signal's category genuinely matches this page's service type and location - a roofing license is highly relevant to a roofing page, irrelevant to a solar page for the same client. Implement this as a real, named, independently-testable function with explicit category-to-service mapping logic, not a placeholder constant.\n\n4. writeProvenance(signal, claim_text, evidence_source): for every signal composed, write a trust_signal_provenance row with the exact claim text that will appear on the page and its exact evidence source - this is what prevents an unsupported '#1' or 'certified' claim from ever appearing without a traceable source. If a claim cannot be traced to a real source, do not compose it - write it to missing_evidence_queue instead.\n\n5. detectMissingCategories(client_id, page_id, availableSignals): compare the 9 real signal categories against what's actually available. For any category with zero real signals, write a missing_evidence_queue row explaining what's needed and why (e.g. 'no manufacturer_credential found in client_ingested_assets for this client - request from operator').\n\n6. computeCoverageScores(page_id, availableSignals): trust_coverage_score = (categories with at least one real signal / 9) * 100. evidence_strength_score = average relevance_score across all composed signals, weighted down by any suppressed/expired signals in the mix. Write to trust_coverage_scores.\n\n7. GBP handling: since no GBP API connection is confirmed to exist anywhere in this codebase (A-48 GBP Control Center is confirmed not built), always treat GBP as GATED - never attempt a GBP call, never simulate GBP data. Log this explicitly in the output rather than silently omitting it.\n\n8. Determine final status: COMPLETED if trust_coverage_score >= 70 with zero expired-signal issues, PARTIALLY_COMPLETED if signals exist but coverage is low or evidence requests were created, NEEDS_HUMAN if zero real signals exist at all for this client (nothing to compose, operator input required before this agent can do anything).\n\n9. Full Contract 69 error capture on every write. Zero LLM calls - this is pure composition and scoring over real ingested data, confirm and state this explicitly (a genuinely zero-cost agent).\n\nCreate src/app/api/agents/a-43/trigger/route.ts, standard operator auth pattern matching an already-migrated route.\n\nTEST MATRIX in tests/unit/agents/a-43.test.ts:\n- Full composition with real signals across multiple categories, correct coverage score math\n- Expired credential correctly suppressed and NEVER appears in composed output - this is the single most important test in this file\n- Missing category correctly triggers a missing_evidence_queue entry with a real reason\n- Relevance scoring correctly differentiates a matching-service signal from a non-matching one\n- Zero-signal client returns NEEDS_HUMAN status, not a crash\n- GBP always reported GATED, never fabricated\n- Closed-loop re-verification: simulate a write where the re-query returns different data than intended, confirm this is caught and logged as an anomaly, not silently passed\n\nRun pnpm tsc --noEmit and pnpm vitest run tests/unit/agents/a-43.test.ts - both clean. Check agent_name enum and permission-matrix sync proactively, same as every prior build tonight.\n\nUpdate STATE_OF_THE_BUILD.md and AGENTS.md, SHIPPED+WIRED, with explicit note that this implements the anti-fabrication and closed-loop-validation principles from the operator's autonomous-agent standard, scoped to what a single-execution BaseAgent can genuinely guarantee - not a persistent runtime.\n\nCommit and push."
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/lib/agents/a-43-trust-signal-composer.ts
    - src/app/api/agents/a-43/trigger/route.ts
    - tests/unit/agents/a-43.test.ts
