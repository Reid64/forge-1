- id: cp-map-stacking-001
  name: Map Stacking API — production timeline, drip cadence timeline, filterable page inventory, differentiating tags
  prompt: |
    Read BLUEPRINT.md Part 9.2 (Final Consolidated Tier Table) for per-tier Base Pages and Drip Cap Phase 1/2/3 values before writing. Read SCHEMA_REGISTRY.md for page_generation_queue's A-37 scheduling columns (migration 20260728370000_a37_page_generation_queue_scheduling.sql) and A-32's content_variations table columns (migration 20260728330000_a32_content_variations.sql) before writing. Read src\app\api\portal\overview\route.ts as the existing portal RLS pattern (Pattern B, client_user_id self-access, no getOperatorContext()).

    Write FILE 1: C:\Users\manag\Documents\Tarritrix\src\app\api\portal\map-stacking\route.ts

    GET handler. RLS-filtered to the authenticated client's own client_id (Pattern B). Return:
    (1) production_timeline: cumulative pages_published over time (from pages.published_at grouped by week) against the client's tier-based page-count goal from pricing_tiers/BLUEPRINT.md Part 9.2's Base Pages + Field Expansion Bonus figures.
    (2) drip_cadence_timeline: this week's assigned publish rate from page_generation_queue's A-37 scheduling data, plus a projected-ramp curve computed from the client's onboarding_completed_at and the Phase 1/2/3 drip-cap table (Phase 1: days 1-30, Phase 2: days 31-60, Phase 3: days 61+) — client-safe framing only: "your publish rate" and a future date, never jitter/fingerprint-diffusion mechanics.
    (3) page_inventory: every published page for this client with city, service, published_at, live URL, and a differentiating_features array of short human-readable tags derived from the content_variations row for that page — read the actual content_variations columns first and map them to plain-English tags (e.g. "storm-response angle," not raw variant IDs).
    Optional query params city and service filter (3) server-side.

    pnpm tsc --noEmit — 0 errors.

    git add -A; git commit --no-verify -m 'feat: portal Map Stacking API — production timeline, drip cadence timeline, filterable page inventory, differentiating tags'; git push origin main. Report commit hash.
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/api/portal/map-stacking/route.ts

- id: cp-map-stacking-002
  name: Map Stacking UI — dual-timeline, clickable filterable inventory table
  prompt: |
    Read src\app\portal\page.tsx and src\app\portal\pages\page.tsx in full before writing to match the portal's existing visual language and component conventions.

    Write FILE 1: C:\Users\manag\Documents\Tarritrix\src\app\portal\map-stacking\page.tsx

    'use client'. Fetch /api/portal/map-stacking. Two side-by-side timeline charts sharing a time axis: Production (cumulative area chart, pages created vs goal line) and Drip Cadence (this week's rate plotted with the projected-ramp curve as a dashed forward projection). Below the timelines: a dropdown filter by city and by service (calling the API with the query params), and a page inventory table where every row is clickable and opens the page's live URL in a new tab. Each row also shows its differentiating_features as a short tag list. No agent names, no LLM cost figures, no internal terminology anywhere (CLAUDE.md /portal rule) — "your publish rate," never "A-37"; "page variations," never "content_variations table." Add this page to src\app\portal\layout.tsx's navigation as "Map Stacking," positioned per the design spec's sidebar order (Overview / Performance / Content Progress / Map Stacking / Backlinks / Reviews / Leads / Site Audit Summary).

    Verify Select-String -Path 'src\app\portal\map-stacking\page.tsx' -Pattern 'A-37|A-32|A-02|agent' -CaseSensitive:$false — must return NOTHING. pnpm tsc --noEmit — 0 errors.

    git add -A; git commit --no-verify -m 'feat: portal Map Stacking dual-timeline and filterable page inventory UI'; git push origin main. Report commit hash.
  gates:
  - type: compile
  - type: file_exists
    files:
    - src/app/portal/map-stacking/page.tsx

