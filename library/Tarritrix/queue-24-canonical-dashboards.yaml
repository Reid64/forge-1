- id: qd-fix-001
  name: 'Fix root cause: auth.admin.listUsers() "Database error finding users" failure'
  prompt: |
    Found 2026-08-04 during the Clients-screen wiring session (STATE_OF_THE_BUILD.md, "canonical UI wiring — 1 of 7 items wired"): supabase.auth.admin.listUsers() returns error "Database error finding users" for this project (jhiplicikizdpdsguimg) regardless of pagination parameters. Confirmed NOT a pagination-size issue (reproduced identically with no options, {perPage:100}, and {perPage:1000}). Confirmed NOT an anomalous-row issue (queried auth.users directly for null email/null metadata/soft-deleted rows — none found). Confirmed live-reproduced in 2 places: src\app\api\operator\clients\route.ts (this queue's own qd-wire-003 dependency) and src\app\dashboard\users\page.tsx (lines 66, 111) — the latter's Email and Granted By columns show "Unknown" for every row in production today.

    Do not repeat the same 3 already-ruled-out diagnoses (pagination, anomalous rows, wrong client type — service-role client already confirmed correctly configured). Investigate further: check Supabase project auth settings for anything that could make the admin Users API specifically fail while normal auth (login, session lookup) works fine (rate limiting on the admin API specifically, a project-level auth configuration flag, GoTrue version/compatibility issue between the installed @supabase/supabase-js version and this project's GoTrue version — check package.json's @supabase/supabase-js version against Supabase's own changelog for known admin.listUsers() regressions). If Supabase MCP tool access is available, check for any admin-API-specific logs or settings not visible via plain SQL.

    If a real fix is found: apply it, then live-verify by re-running the exact call from both affected files and confirming real emails resolve (not "Unknown"/blank) for at least 3 real users.

    If no root cause can be confirmed after genuine investigation (not guessed): report this explicitly as a confirmed-unresolved infrastructure issue, do NOT ship a workaround that fabricates data or silently masks the failure, and leave both affected files' existing graceful-degradation fallback (blank/"Unknown") in place exactly as it already is.

    pnpm tsc --noEmit — 0 errors.

    git add -A; git commit -m 'fix: investigate and resolve (or confirm-unresolved) the auth.admin.listUsers Database error finding users failure'; git push origin main. Report commit hash and state explicitly which outcome occurred.
  gates:
  - type: compile

