#
# Source of truth for every citation in this queue: docs/audits/2026-08-04-command-center-gap-analysis.md
# (Section 1 live-conflict findings, Section 2 REAL/PARTIAL/NET-NEW classification, Section 3
# cross-cutting bugs) plus the same-day STATE_OF_THE_BUILD.md session logs for the two schema fixes
# (commit 4bf18ac: approvals, client_brand_voice_model, client_keyword_gap_analysis all now live) and
# the Clients-screen wiring precedent (commit 04ab48f: src/app/dashboard/clients/page.tsx +
# clients.module.css — the established pattern for porting the canonical file's CSS verbatim into a
# scoped CSS Module rather than reinventing colors, and for reusing already-real backends as-is).
#
# Stale-audit corrections already applied before this queue was authored (per operator instruction,
# not re-derived here): the audit doc's `approvals` and `keyword-intel` rows are REAL as of commit
# 4bf18ac, not PARTIAL. Both tables exist live. Do not re-litigate this in any prompt below.
#
# Architecture decision for prompts 1-2 (shells), stated once here rather than repeated in both
# prompts: each canonical file becomes its own new route tree under the existing /dashboard shell
# (src/app/dashboard/command-center/, src/app/dashboard/social-command/) — NOT a replacement of the
# existing /dashboard root, which stays exactly as-is per every prior queue's own standing instruction
# (queue-19: "the existing shell... stays exactly as-is"; MonthlyGrowthTimeline is portal-side and out
# of scope for this queue entirely). Each shell uses a per-section component registry
# (SECTION_REGISTRY: Record<key, ComponentType>) with a shared GenericStubSection fallback for any key
# not yet in the registry — this exactly mirrors the canonical file's own renderWorkspace() dispatch-map
# pattern (map[state.section] || renderGenericOps(state.section)), so later prompts populate the
# registry incrementally instead of editing a giant switch statement. CSS is ported verbatim (values
# unchanged, selectors renamed for CSS Modules scoping) from each canonical file's own <style> block,
# scoped so none of it leaks into the other, untouched, pre-existing dashboard/portal routes.
#
# Explicit judgment-call convention for prompts 3-22 (wiring): the operator's instruction requires
# confirming genuine bespoke canonical content exists for each key BEFORE wiring it, honest-stubbing
# instead if not, and noting the gap rather than forcing a design. This queue does not pre-resolve
# that determination for any of the 20 keys — each wiring prompt below instructs the executing session
# to read the canonical file's actual dispatch entry for that exact key first (renderWorkspace()'s map
# for command-center; PRIMARY_NAV/SECONDARY_NAV's external flag and SEC_LABELS for social-command) and
# branch: bespoke render function found -> build faithfully; key marked external:true (cross-link by
# design, confirmed for every social-command PRIMARY_NAV item at authoring time: client-workspace,
# map-stacking, storm-intel, gsc-module, client-portal, master-admin) -> wire as a real navigation
# link to the cited existing route, no new screen; GENERIC_ROW_TEMPLATES entry only or no entry at all
# -> honest-stub per the src/app/portal/backlinks/page.tsx pattern and report the gap explicitly. This
# is not deferred out of laziness — five of the twenty keys (gsc, agent-control, crawling, indexation,
# schema) were directly confirmed to have real dispatch entries during this queue's authoring (read
# docs/design/tarritrix-command-center.html:1237-1260's renderWorkspace() map directly); the remaining
# keys were not individually re-verified for this file to avoid re-doing the exact investigation the
# 2026-08-04 wiring session already did for clients/onboarding/team-roles/audit-logs/billing/
# page-inventory/platform-settings (see STATE_OF_THE_BUILD.md, "canonical UI wiring — 1 of 7 items
# wired, 6 stopped on hidden conflicts") — each remaining key gets the same live check this queue
# describes, not a guess baked into this file.
#
# Batch-count reconciliation for prompts 23-37 (stated as "15 prompts" against 14 numbered batches in
# the operator's own instruction): batch (10)'s "Client Ops remainder... plus Analytics: analytics"
# is split into two prompts here — qd-stub-010 (Client Operations remainder) and qd-stub-011 (Analytics)
# — because Analytics is genuinely its own top-level NAV group in the canonical file (a single-item
# group, "Reporting"), not a Client Operations item; splitting it is more structurally correct AND
# reconciles the stated count of 15 exactly. Every other batch maps one-to-one to one prompt.
#
# Governance lock, non-discretionary: per AGENTS.md and STATE_OF_THE_BUILD.md, A-48 (GBP), A-45
# (Backlink Intelligence), A-40 (External Signal Coordination/outreach), A-24 (Competitor analysis),
# and SERP intelligence (AGENTS.md-gated to Phase 1.5, not integrated) are all explicitly HELD or
