  name: Confirm or add Contract 73 (A-44 prerequisite) enforcement in A-02's live onboarding code path
  prompt: |
    Root cause under investigation (flagged, not yet confirmed, by the 2026-07-30 audit — verify directly before changing anything, per Contract 46): two live A-02 implementations exist. src\lib\agents\a-02-page-generator.ts (reachable via the manual trigger route /api/agents/a-02/trigger) was reported by AGENTS.md's prior status note as enforcing the Contract 73 check (the client_ingestion_versions is_current=TRUE AND status IN ('success','manually_provided') check documented in AGENTS.md's A-02 spec section). The SEPARATE legacy implementation at src\agents\a-02-page-generator\index.ts — which is the one actually invoked by the real production onboarding flow via src\app\api\operator\onboard-client\route.ts — has NOT been confirmed either way to contain this same check.

    Step 1: read src\lib\agents\a-02-page-generator.ts in full and quote the exact lines implementing the Contract 73 check (client_ingestion_versions query + throw ContractViolationError pattern from AGENTS.md's A-02 spec). Confirm it is genuinely present, not assumed.

    Step 2: read src\agents\a-02-page-generator\index.ts in full. Search specifically for any query against client_ingestion_versions or any Contract 73 / ContractViolationError reference. Report explicitly whether the check is present or absent — do not guess.

    Step 3, only if Step 2 confirms the check is absent: add the identical Contract 73 prerequisite check to src\agents\a-02-page-generator\index.ts at its entry point, before any LLM call, using the exact query and condition documented in AGENTS.md's A-02 spec section (client_id match, is_current=TRUE, status IN ('success','manually_provided'), approval_status IN ('auto_approved','approved','manually_provided')) — copy the real, verified-working query shape from the lib version confirmed in Step 1, do not write a new one from memory. Throw the same ContractViolationError class/pattern already used elsewhere in this codebase for Contract 73 (search for existing ContractViolationError usage first).

    Step 4, only if Step 3 was needed: this is the exact prerequisite path real client onboarding uses, so also add or confirm an existing test (tests/unit/agents/ or tests/integration/) that onboards a client with no client_ingestion_versions row and asserts A-02 (the legacy/onboarding-path version specifically) refuses to generate pages.

    pnpm tsc --noEmit — 0 errors. pnpm vitest run — all passing, including any new/existing A-02 legacy-path test.

    git add -A; git commit --no-verify -m 'fix: confirm/add Contract 73 enforcement in A-02 legacy onboarding-path implementation' (or, if Step 2 found the check already present, make no code change and instead: git add AGENTS.md; git commit --no-verify -m 'docs: confirm Contract 73 enforcement present in both A-02 implementations, closing open audit item'); git push origin main. Report commit hash and state explicitly which of the two outcomes occurred (check was already present vs. check was added).
