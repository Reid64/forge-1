# QUEUE 20 — Master Admin Console, new /dashboard/master-admin route (TARRITRIX_DASHBOARD_SYSTEM_SPEC.md Section 4)
#
# Same source-file note as queue-19: TARRITRIX_DASHBOARD_SYSTEM_SPEC.md is not in the Tarritrix
# repo, found at C:\Users\manag\Downloads\Recent Downloads\TARRITRIX_DASHBOARD_SYSTEM_SPEC.md
# (v2.0), read in full. Treating the operator's direct instruction as the sign-off the spec's own
# header requires before any build queue exists.
#
# RBAC: Contract 71 forbids raw role checks (`user.role === 'master_admin'`). This queue adds a
# new permission-matrix action (view_master_admin_console) in both required locations
# (src/lib/auth/permission-matrix.ts and ROLE_HIERARCHY_ARCHITECTURE_SPEC.md Section 3) before
# any route or component checks it, so scripts/verify-permission-matrix-sync.ts stays green.
#
# Company Switcher data reality — UPDATED 2026-07-29, resolved (was previously an open item in
# this queue): the duplicate-"Tarritrix" anomaly flagged when this queue was first written has
# since been investigated and corrected directly against the live database. Canonical tenant is
# `9a5a8d77-fa1c-4e4e-a073-336b1623f7a6` (real address/website/agent activity, now status=active).
# `aaaaaaaa-0000-0000-0000-000000000001` was a synthetic Contract-73 seed placeholder with zero
# real data anywhere in the schema (verified across all 61 tables with a client_id FK) — it is
# now archived (`clients.is_archived=true`, new column added in migration
# 20260729140000_add_clients_is_archived.sql) and renamed to "Tarritrix (seed placeholder — do
# not use)", not deleted. Full findings in STATE_OF_THE_BUILD.md's 2026-07-29 "Canonical
# Tarritrix Tenant Correction" session log and SCHEMA_REGISTRY.md's clients (Table 2) notes.
# ma-002 below queries the corrected UUID and filters on the new is_archived column — it does not
# surface a data_quality_note, since there is nothing left to reconcile. E4 Construction &
# Roofing (`e4ee4ee4-0000-0000-0000-000000000001`) remains the only other "My Companies"
# candidate, flagged `is_demo_seed=true` per Contract 36's canonical-demo-tenant convention.
# "Architectural Flashing Supply" does NOT exist as a Tarritrix `clients` row at all — it is a
# separate FORGE project (library/afs-website), unrelated to this codebase's client roster.
# ma-002 does not fabricate an AFS entry.
#
# Platform Health drift check: does not require a new Vercel API token. VERCEL_GIT_COMMIT_SHA is
# already auto-injected by Vercel at build time (already used in this codebase per the B3
# Sentry release-tag config in AGENTS.md). The drift check compares that value against
# origin/main's current HEAD fetched from the public GitHub REST API
# (api.github.com/repos/Reid64/tarritrix/commits/main), unauthenticated (60 req/hr is sufficient
# for a low-traffic admin panel) unless GITHUB_TOKEN is present in env, in which case it's used
# for a higher rate limit. Neither GITHUB_TOKEN nor VERCEL_GIT_COMMIT_SHA currently appears
# anywhere in src/ (checked before writing this queue) — this is the first use of both, not a
# gap being papered over.
#
# Governance Sweep Tracker: "live" per the operator's instruction means a live database query,
# not a runtime parse of SCHEMA_REGISTRY.md (a markdown file is not reliably available to read
# from inside a deployed serverless function, and parsing prose for a table count would be
# fragile). pg_policies is a system catalog view not exposed through PostgREST by default, so
# ma-004 adds one SECURITY DEFINER Postgres function (mirroring the existing
# check_llm_cost_with_lock() pattern already in this codebase) that queries pg_policies
# server-side and is called via Supabase RPC — not a new table, a single function.

