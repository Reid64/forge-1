- id: ma-004
  name: Governance Sweep Tracker (live Pattern C RLS count via new RPC function)
  prompt: |
    Read the existing check_llm_cost_with_lock() function definition (supabase/migrations/20260514230000_llm_cost_check_function.sql) in full before writing — this new function follows the same SECURITY DEFINER pattern.

    Write FILE 1: C:\Users\manag\Documents\Tarritrix\supabase\migrations\20260729130000_pattern_c_remaining_count_function.sql

    CREATE OR REPLACE FUNCTION get_pattern_c_remaining() RETURNS TABLE(tablename text, policyname text) LANGUAGE sql SECURITY DEFINER SET search_path = public AS $$ SELECT p.tablename::text, p.policyname::text FROM pg_policies p WHERE p.schemaname = 'public' AND p.qual ILIKE '%operator_id%'; $$;
    GRANT EXECUTE ON FUNCTION get_pattern_c_remaining() TO authenticated;

    Verify Test-Path 'supabase\migrations\20260729130000_pattern_c_remaining_count_function.sql' returns True. Do NOT run supabase db push in this prompt — apply as a separate explicitly authorized step, same convention as this session's other written-not-applied migrations.

    Write FILE 2: C:\Users\manag\Documents\Tarritrix\src\app\api\dashboard\master-admin\governance-sweep\route.ts

    GET handler. getOperatorContext() + hasPermission check. Call the get_pattern_c_remaining RPC via Supabase client. Group results by tablename, return { remaining_table_count: number, remaining_tables: string[], total_pattern_c_ever_found: 61 } — the 61 figure is a static reference to the machine-counted 2026-07-28 baseline documented in SCHEMA_REGISTRY.md, not a live count; label it clearly as the baseline, not current state, in the response.

    Write FILE 3: C:\Users\manag\Documents\Tarritrix\src\components\dashboard\GovernanceSweepTracker.tsx

    'use client'. Fetch /api/dashboard/master-admin/governance-sweep. Progress bar: (61 - remaining_table_count) / 61 migrated, remaining table names listed below it. TypeScript strict, no any. Default export GovernanceSweepTracker.

    pnpm tsc --noEmit — 0 errors.

    git add -A; git commit -m 'feat: Governance Sweep Tracker with live Pattern C RLS count via new RPC function (migration written, not applied)'; git push origin main. Report commit hash.
  gates:
  - type: compile
  - type: file_exists
    files:
    - supabase/migrations/20260729130000_pattern_c_remaining_count_function.sql
    - src/app/api/dashboard/master-admin/governance-sweep/route.ts
    - src/components/dashboard/GovernanceSweepTracker.tsx

