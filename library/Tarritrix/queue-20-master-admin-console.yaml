- id: ma-003
  name: Platform Health panel (Vercel-deployment-vs-HEAD drift check)
  prompt: |
    Read AGENTS.md's B3 Structured Logging section for the existing VERCEL_GIT_COMMIT_SHA usage pattern before writing.

    Write FILE 1: C:\Users\manag\Documents\Tarritrix\src\app\api\dashboard\master-admin\platform-health\route.ts

    GET handler. getOperatorContext() + hasPermission check (view_master_admin_console). Read process.env.VERCEL_GIT_COMMIT_SHA (this deployment's own build commit — no new credential needed, Vercel auto-injects it). Fetch https://api.github.com/repos/Reid64/tarritrix/commits/main (use GITHUB_TOKEN from env as a Bearer header if present, otherwise call unauthenticated) to get origin/main's current HEAD sha. Return { deployed_sha: string, main_head_sha: string, drift: boolean, drift_message: string | null } — drift=true and a plain-English message when the two shas differ, drift=false when they match. If VERCEL_GIT_COMMIT_SHA is unset (e.g. local dev), return deployed_sha: null and drift: null rather than fabricating a value. Also query cron_run_log for the most recent run per CRON job and agent_events for the most recent event per agent, returning last_run/last_event timestamps for a "last deployment / last activity" summary row.

    Write FILE 2: C:\Users\manag\Documents\Tarritrix\src\components\dashboard\PlatformHealthPanel.tsx

    'use client'. Fetch /api/dashboard/master-admin/platform-health. Prominent drift indicator — red banner with drift_message when drift=true, green "production matches main" when false, neutral state when null. Below it, FORGE queue status (fetch and display the same data /api/dashboard/cron-status already exposes, do not duplicate that route's query logic — call it) and the last-deployment/last-activity summary. TypeScript strict, no any. Default export PlatformHealthPanel.

